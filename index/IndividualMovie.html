<!DOCTYPE html>
<html lang="en">
<head>

    <title>Individual movie Page</title>

    <!-- 🔗 Link to your CSS -->
    <link rel="stylesheet" href="../CSS/IndividualMovie.css">
</head>
<body class="Body">
    

<header class="nav">
    <div class="nav__left">
      
      <div class="logo" aria-label="Pixie Flix" title="Neko Fan">
        <img class="IMP-logo"  src="../Assets/logo black and white.svg">
         
      </div>
      <span class="brand">P1xie Flix</span>
    </div>

    <nav class="nav__center" aria-label="Primary">
      <a class="nav__link is-active" href="#">Home</a>
      <a class="nav__link" href="#">movie library</a>
      <a class="nav__link" href="#">Favourites</a>
    </nav>

    <div class="nav__right">
      <form class="search" role="search" aria-label="Site search" onsubmit="return false;">
        <input class="search__input" type="search" placeholder="Search" aria-label="Search"/>
        <button class="search__button" type="submit" aria-label="Search">
          
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#E02424" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </button>
      </form>
    </div>
  </header>



    <div class="container-fluid-IMP">
        <div class="row>" id="movieCards">

        </div>
    </div>

    
    <footer class="site-footer">
    <!-- Logo + tagline -->
    <div class="footer-logo">
      <img src="../Assets/logo black and white.svg">
      <span class="IMP-logo" class="tagline">fewer pixels, more perfection.</span>
    </div>

    <!-- Navigation -->
    <nav class="footer-nav" aria-label="Footer navigation">
      <a href="#">Homepage</a>
      <a href="#"></a>
      <a href="#">Contact Us</a>
    </nav>

    <!-- Bottom icons + note -->
    <div class="footer-bottom">
      <div class="footer-icons">
        
      <p class="footer-note">@Openwindow &amp; Pixels.</p>
    </div>
  </footer>

  <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

      crossorigin="anonymous"
    ></script>

    <!-- ⚙️ Link your JavaScript (placed at the end of <body>) -->
    <script src="../js script/script.js"></script>
</body>
</html>
